name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MisStickers.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: MisStickers-apk
          path: MisStickers.apk

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-build${{ github.run_number }}"
          gh release create "$TAG" MisStickers.apk \
            --title "Mis Stickers (build ${{ github.run_number }})" \
            --notes "APK listo para instalar. Requiere Android 10+." \
            --latest
